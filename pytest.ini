[pytest]
testpaths = tests
# ONNX export/investigation scripts require a machine-installed paddle2onnx
# converter (also needs `onnxruntime`). They exercise the export toolchain,
# not core data/mel/HuBERT logic, so they are skipped for generic runs —
# install paddle2onnx and invoke them directly when working on ONNX export.
addopts =
    --ignore=tests/test_onnx_components.py
    --ignore=tests/test_onnx_export.py
    --ignore=tests/test_onnx_fix_and_verify.py
    --ignore=tests/test_onnx_full_verify.py
    --ignore=tests/test_onnx_graph_bug.py
    --ignore=tests/test_onnx_old_format.py
    --ignore=tests/test_onnx_single_ops.py
    --ignore=tests/test_onnx_workaround.py
    --ignore=tests/test_layer_norm_onnx.py