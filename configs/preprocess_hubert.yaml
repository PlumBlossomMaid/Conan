# ============================================================================
# Conan — Preprocess: HuBERT distillation targets
# Produces mel + HuBERT HDF5 files for Stage 1 content-extractor training.
# ============================================================================

base_config: configs/base.yaml

preprocess_cls: entry.preprocess_hubert.HubertPreprocessor

# 数据路径
data:
  wavs_dir: /tmp/conan_dataset/LibriTTS_audio
  output_dir: /tmp/conan_dataset/LibriTTS_hubert
  hubert_emb_dir: /tmp/conan_dataset/LibriTTS_hubert
  hubert_checkpoint: /tmp/conan_dataset/AMD_server/hubert4_paddle_aligned_20260818.pdparams
  n_valid: 150
  valid_seed: 1234

# 单进程 Paddle HuBERT，使用动态帧预算并在显存不足时递归缩小批次
preprocessing:
  max_batch_size: 16
  max_batch_frames: 24000
  max_attention_tokens: 12000000
  memory_limit: auto
  device: iluvatar_gpu:0
  hdf5_compression: gzip
