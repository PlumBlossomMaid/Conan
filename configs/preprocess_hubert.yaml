# ============================================================================
# Conan — Preprocess: HuBERT distillation targets
# Produces mel + HuBERT HDF5 files for Stage 1 content-extractor training.
# ============================================================================

base_config: configs/base.yaml

preprocess_cls: entry.preprocess_hubert.HubertPreprocessor

# 数据路径
data:
  archive_dir: data
  wavs_dir: data/libritts/wavs
  output_dir: data/libritts
  hubert_emb_dir: data/libritts/hubert_embeddings
  hubert_checkpoint: weights/hubert4_paddle_aligned_20260818.pdparams
  n_valid: 150
  valid_seed: 1234

# 单进程 Paddle HuBERT，使用 batch 维度并行
preprocessing:
  extract_archives: true
  flatten_existing: false
  max_batch_size: 8
  max_batch_frames: 8000
  device: gpu:0
