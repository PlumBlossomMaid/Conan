# ============================================================================
# Conan — Stage 1 (formal): Stream Content Extractor, paper-aligned CE
# Paper arXiv 2507.14534v4 trains the SCE with cross-entropy over discrete
# content labels ("Softmax over J classes per frame"). Build the codebook
# first (entry/build_label_codebook.py), then this config distils labels
# instead of regressing continuous embeddings. 80k steps = paper Stage-1.
#
# Launch (machine-local data paths passed at runtime):
#   python entry/train.py -c configs/content_extractor_ce.yaml \
#     -o data.hdf5_path=/absolute/path/to/train.h5 \
#     -o data.val_hdf5_path=/absolute/path/to/valid.h5 \
#     -o data.label_codebook=/absolute/path/to/codebook_256.npy
# ============================================================================

task_cls: models.content_extractor.ContentExtractorModel

audio:
  sample_rate: 16000
  n_fft: 1024
  hop_size: 320
  win_size: 1024
  num_mels: 80
  max_frames: 500
  f0_min: 40.0
  f0_max: 1100.0

content_extractor:
  d_model: 512
  nhead: 8
  num_layers: 6
  output_dim: 256            # HuBERT embedding dim (= codebook feature dim)
  chunk_size: 4              # frames per chunk (80ms at 50Hz)
  left_context: 1
  right_context: 2           # 0 for strictly causal
  dim_feedforward: 2048
  dropout: 0.1
  loss_type: ce              # paper-aligned: CE over J discrete labels
  num_labels: 256            # J — must match codebook num_labels

training:
  steps: 80000               # paper Stage-1 schedule
  learning_rate: 2e-4
  step_size: 5000
  gamma: 0.8
  batch_size: 24               # was 10; bumped after measuring 15% VRAM at batch=10
  accumulate_grad_batches: 3   # effective batch = 72 samples (3x the previous 30)
  num_workers: 0
  accelerator: gpu
  devices: 1
  precision: 32-true        # fp16 AMP measured *slower* on Iluvatar (cast overhead)
  clip_grad: 1.0
  log_every: 100
  val_check_interval: 1000
  num_sanity_val_steps: 1
  num_ckpt_keep: 3
  max_batch_frames: 12000      # was 5000; scales with batch_size
  sampler_frame_count_grid: 50
  lr_scheduler: step              # StepDecay: LR *= 0.8 every 5000 steps

data:
  data_dir: data/libritts
  # Machine-local HDF5 paths passed at launch (-o), see header comment.
  hdf5_path: data/libritts/hubert_embeddings/train.h5
  val_hdf5_path: data/libritts/hubert_embeddings/valid.h5
  val_max_samples: 50
  # Centroid table from entry/build_label_codebook.py (gitignored data artifact).
  label_codebook: data/libritts/codebook_256.npy

logger: visualdl
# Pin the VisualDL version directory so a resume writes into the same
# version_0 and the curves stay continuous across restarts.
log_version: 0
log_dir: logs/content_extractor_ce
ckpt_dir: ckpts/content_extractor_ce
