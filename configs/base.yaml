# ============================================================================
# Conan — 基础配置
# 所有 Conan 实验继承此配置
# ============================================================================

# GPU / 设备
device: cuda
gpu_id: 0

# 数据
data:
  archive_dir: data
  wavs_dir: data/libritts/wavs
  output_dir: data/libritts
  hubert_emb_dir: data/libritts/hubert_embeddings
  hubert_onnx: weights/hubert_batch.onnx
  sample_rate: 16000
  n_valid: 1000  # validation 样本数

# 预处理（Binarizer）
preprocessing:
  extract_archives: true
  flatten_existing: false
  max_batch_size: 8
  onnx_provider: auto
  device_id: 0
  allow_cpu_fallback: false

# 训练
training:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_steps: 80000
  learning_rate: 2e-4
  batch_size: 4
  accumulate_grad_batches: 2
  num_workers: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  val_check_interval: 5000

# 模型
model:
  content_dim: 256
  timbre_dim: 256
  style_dim: 64
  code_dim: 64
  num_codes: 128
  d_model: 512
  nhead: 8
  num_layers: 6
  dim_feedforward: 2048
  dropout: 0.1

# 日志
logging:
  logger: tensorboard
  log_dir: logs
  ckpt_dir: ckpts
