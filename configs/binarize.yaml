# ============================================================================
# Conan — 二值化（数据预处理）配置
# 继承 base.yaml，指定 binarizer 和数据路径
# ============================================================================

# 继承基础 config
base_config: configs/base.yaml

# 使用的 Binarizer 类
binarizer_cls: scripts.binarize_conan.ConanBinarizer

# 覆盖数据路径
data:
  wavs_dir: datas/libritts/wavs
  output_dir: datas/libritts

# 预处理参数
preprocessing:
  num_workers: 1  # 单进程 CUDA
  chunk_size: 10
