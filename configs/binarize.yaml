# ============================================================================
# Conan — 二值化（数据预处理）配置
# 继承 base.yaml，所有参数从 config 读取
# ============================================================================

base_config: configs/base.yaml

binarizer_cls: scripts.binarize_conan.ConanBinarizer

# 数据路径
data:
  archive_dir: data
  wavs_dir: data/libritts/wavs
  output_dir: data/libritts
  hubert_emb_dir: data/libritts/hubert_embeddings
  hubert_onnx: weights/hubert_batch.onnx
  n_valid: 1000

# 单进程单 ONNX session，使用 ONNX batch 维度并行
preprocessing:
  extract_archives: true
  flatten_existing: false
  max_batch_size: 8
  onnx_provider: auto
  device_id: 0
  allow_cpu_fallback: false
