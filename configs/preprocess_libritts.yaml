# ============================================================================
# Conan — Preprocess: LibriTTS archive extraction
# Flattens LibriTTS audio archives into data/libritts/wavs.
# ============================================================================

base_config: configs/base.yaml

preprocess_cls: entry.preprocess_libritts.LibriTTSPreprocessor

data:
  archive_dir: data
  wavs_dir: data/libritts/wavs
  output_dir: data/libritts

preprocessing:
  flatten_existing: false
